name: Feature request
description: A mark, a check or a page format the kit should have
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to draw or check?
      description: The page or the problem, not the implementation. A sketch or a reference image helps.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How do you do it today?
      description: The workaround, if any (a page-local helper, a manual check).
    validations:
      required: false
